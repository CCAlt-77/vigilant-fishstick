# Publishes the game to GitHub Pages on every push, and turns Pages on the first
# time it runs so there is no need to visit repository settings.
#
# It publishes to a gh-pages branch rather than using the Pages "GitHub Actions"
# source on purpose: that source deploys through the github-pages environment,
# which by default only accepts deployments from the default branch, and this
# work lives on a feature branch.

name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/iphone-tennis-game-i0fumx
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages
  pages: write      # enable Pages on the first run

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the rules still hold
        run: |
          node tools/test-scoring.mjs
          node tools/test-serve.mjs

      - name: Rebuild the single-file bundle
        run: node tools/build.mjs

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          cp dist/index.html _site/standalone.html
          touch _site/.nojekyll
          ls -R _site | head -40

      - name: Push the site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Publish ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Turn Pages on, if it is not already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BODY='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages is already enabled; making sure it points at gh-pages."
            echo "$BODY" | gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null 2>&1 \
              || echo "::warning::Could not update the Pages source. Check Settings -> Pages."
          else
            echo "$BODY" | gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null 2>&1 \
              && echo "Pages enabled." \
              || echo "::warning::Could not enable Pages automatically. Set Settings -> Pages -> Deploy from a branch -> gh-pages -> / (root). The branch is already built and waiting."
          fi
          OWNER=$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)
          echo "### Site: https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Single-file build: https://${OWNER}.github.io/${REPO}/standalone.html" >> "$GITHUB_STEP_SUMMARY"
          exit 0
