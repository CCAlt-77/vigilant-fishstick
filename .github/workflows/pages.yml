# Publishes the game to GitHub Pages on every push, and turns Pages on the first
# time it runs so there is no need to visit repository settings.
#
# It publishes to a gh-pages branch rather than using the Pages "GitHub Actions"
# source on purpose: that source deploys through the github-pages environment,
# which by default only accepts deployments from the default branch, and this
# work lives on a feature branch.

name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/iphone-tennis-game-i0fumx
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages
  pages: write      # enable Pages on the first run

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the rules still hold
        run: |
          node tools/test-scoring.mjs
          node tools/test-serve.mjs

      - name: Rebuild the single-file bundle
        run: node tools/build.mjs

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          cp dist/index.html _site/standalone.html
          touch _site/.nojekyll
          ls -R _site | head -40

      - name: Push the site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Publish ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Point Pages at the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${GITHUB_REPOSITORY}"
          BODY='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'

          echo "::group::Pages configuration before"
          gh api "repos/${REPO}/pages" > before.json 2> before.err
          cat before.json before.err
          echo "::endgroup::"

          SRC=$(jq -r '.source.branch // "none"' before.json 2>/dev/null)
          BT=$(jq -r '.build_type // "none"' before.json 2>/dev/null)
          echo "source=${SRC} build_type=${BT}"

          if [ "$SRC" = "none" ] && [ "$BT" = "none" ]; then
            echo "::group::Enabling Pages"
            echo "$BODY" | gh api -X POST "repos/${REPO}/pages" --input - 2>&1
            RC=$?
            echo "::endgroup::"
          elif [ "$SRC" = "gh-pages" ] && [ "$BT" = "legacy" ]; then
            echo "Already publishing from gh-pages."
            RC=0
          else
            echo "::group::Switching the source to gh-pages"
            echo "$BODY" | gh api -X PUT "repos/${REPO}/pages" --input - 2>&1
            RC=$?
            echo "::endgroup::"
          fi

          echo "::group::Pages configuration after"
          gh api "repos/${REPO}/pages" 2>&1 | tee after.json
          echo "::endgroup::"

          # Nudge a build, in case pushing the branch did not start one.
          gh api -X POST "repos/${REPO}/pages/builds" >/dev/null 2>&1 \
            && echo "Requested a Pages build." || echo "No build requested (Pages may not be on this source yet)."

          NOW_SRC=$(jq -r '.source.branch // "none"' after.json 2>/dev/null)
          OWNER=$(echo "${REPO}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${REPO}" | cut -d/ -f2)
          URL="https://${OWNER}.github.io/${NAME}/"

          {
            if [ "$NOW_SRC" = "gh-pages" ]; then
              echo "### The site is publishing"
              echo ""
              echo "- Game: ${URL}"
              echo "- Single file: ${URL}standalone.html"
              echo ""
              echo "The first build after enabling can take a couple of minutes."
            else
              echo "### One manual step left"
              echo ""
              echo "The built site is on the \`gh-pages\` branch, but Pages could not be"
              echo "repointed at it automatically (it is currently on \`${NOW_SRC}\`)."
              echo ""
              echo "In a browser: **Settings -> Pages -> Build and deployment ->"
              echo "Source: Deploy from a branch -> Branch: gh-pages -> / (root) -> Save**."
              echo ""
              echo "Then: ${URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NOW_SRC" != "gh-pages" ]; then
            echo "::warning::Pages is on '${NOW_SRC}', not gh-pages. See the job summary for the one manual step."
          fi
          exit 0
